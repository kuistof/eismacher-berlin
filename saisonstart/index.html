<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saisonstart-Liste – Die Eismacher</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#c0102a" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍦</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #c0102a; --red-deep: #8c0c20; --berry: #a30f25; --pink: #e79ab2;
    --ivory: #fbf4e8; --paper: #fffdf9; --ink: #20140d; --ink-soft: #8a766a; --line: #ece0cd; --hair: #e2cdb0;
    --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Jost", system-ui, -apple-system, sans-serif;
    --shadow: 0 30px 70px -40px rgba(140, 12, 32, .5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans); font-weight: 300; color: var(--ink); background-color: var(--ivory);
    background-image: radial-gradient(110% 55% at 50% -10%, rgba(192, 16, 42, .12), transparent 60%);
    background-attachment: fixed; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 64px 24px; text-align: center; }
  .kicker { font-weight: 500; font-size: .68rem; letter-spacing: .36em; text-transform: uppercase; color: var(--berry); }
  .card { margin-top: 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 40px 30px; box-shadow: var(--shadow); }
  .icon { font-size: 2.6rem; line-height: 1; }
  h1 { margin-top: 16px; font-family: var(--display); font-style: italic; font-weight: 600; font-size: clamp(2rem, 8vw, 2.6rem); line-height: 1.1; color: var(--red); }
  .text { margin-top: 14px; font-family: var(--display); font-size: 1.25rem; line-height: 1.5; color: var(--ink); }
  .btn { display: inline-block; margin-top: 26px; padding: 15px 26px; border-radius: 12px; background: var(--red); color: #fff; font-size: .8rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; }
  .btn:hover { background: var(--red-deep); }
  .sign { margin-top: 36px; font-family: var(--display); font-style: italic; font-size: 1.35rem; }
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">Die Eismacher · Saisonstart-Liste</p>
  <section class="card">
    <div class="icon" id="icon">🍦</div>
    <h1 id="title">Einen Moment …</h1>
    <p class="text" id="text">Wir schauen kurz in unsere Liste.</p>
    <a class="btn" href="/">Zur Startseite</a>
  </section>
  <p class="sign">Bis bald, mit einer Kugel in der Hand.</p>
</main>

<script>
  // Muss dieselbe URL sein wie SIGNUP_ENDPOINT in /index.html
  const SIGNUP_ENDPOINT = "https://script.google.com/macros/s/AKfycbzGTz_y5KxXQxAQNHlWexZ3NwBop5PjjxDmPWvyVLn9anOiPmSkWFJtTKO7xGj8vPiE/exec";

  (async function () {
    const p = new URLSearchParams(location.search);
    const token = p.get("t") || "";
    const action = p.get("a") === "abmelden" ? "abmelden" : "bestaetigen";
    const show = (icon, title, text) => {
      document.getElementById("icon").textContent = icon;
      document.getElementById("title").textContent = title;
      document.getElementById("text").textContent = text;
    };
    if (!token || !SIGNUP_ENDPOINT) {
      show("🤔", "Hier fehlt etwas", "Der Link ist unvollständig. Öffne ihn bitte direkt aus der Mail.");
      return;
    }
    try {
      const res = await fetch(SIGNUP_ENDPOINT + "?a=" + action + "&t=" + encodeURIComponent(token));
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      if (action === "abmelden") {
        show("👋", "Du bist abgemeldet", "Schade! Wir schreiben dir keine Mails mehr. Vorbeikommen darfst du natürlich trotzdem jederzeit.");
      } else {
        show("🎉", "Du bist dabei!", "Sobald wir im Frühjahr wieder aufmachen, bekommst du eine Mail von uns, und darin steckt deine Gratis-Kugel.");
      }
    } catch (err) {
      show("🤔", "Das hat nicht geklappt", "Der Link ist ungültig oder abgelaufen. Trag dich auf der Startseite einfach noch mal ein.");
    }
  })();
</script>
</body>
</html>
